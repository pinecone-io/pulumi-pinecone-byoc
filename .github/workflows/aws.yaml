name: AWS

on:
  workflow_call:
    inputs:
      shape:
        description: >-
          Which network shape to run. vanilla lets the module create its own VPC;
          carve hands it a stand-in customer VPC to carve subnets out of.
        type: string
        default: vanilla
      tier:
        description: >-
          network applies only the VPC component and its children with
          `pulumi up --target` (minutes, no control plane); e2e deploys the whole
          cluster (over an hour).
        type: string
        default: network

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  PINECONE_AZS: us-east-2a,us-east-2b

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.tier == 'e2e' && 150 || 40 }}
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack prefix
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "E2E_STACK_PREFIX=ci-aws-${TIER}-pr${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "E2E_STACK_PREFIX=ci-aws-${TIER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER: ${{ inputs.tier }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 43200

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      - name: Install kubectl
        if: inputs.tier == 'e2e'
        uses: azure/setup-kubectl@v4

      - name: Run and tear down (${{ inputs.tier }}, ${{ inputs.shape }})
        env:
          PINECONE_API_KEY: ${{ inputs.tier == 'e2e' && secrets.PINECONE_API_KEY || '' }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          uv run --extra aws pytest \
            -m "${{ inputs.tier }}" \
            -k "${{ inputs.shape }}" -s --keep

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-aws-${{ inputs.shape }}-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          # both paths are dotted, and upload-artifact skips hidden files by default
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  down:
    needs: up
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack names
        run: |
          if [ -n "$PR_NUMBER" ]; then
            prefix="ci-aws-${TIER}-pr${PR_NUMBER}-${GITHUB_SHA::7}"
          else
            prefix="ci-aws-${TIER}-${GITHUB_SHA::7}"
          fi
          echo "E2E_STACK_PREFIX=$prefix" >> "$GITHUB_ENV"
          if [ "$TIER" = e2e ]; then
            echo "PROJECT_STACK=${prefix}-${SHAPE}-byoc" >> "$GITHUB_ENV"
          else
            echo "PROJECT_STACK=${prefix}-${SHAPE}-network" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER: ${{ inputs.tier }}
          SHAPE: ${{ inputs.shape }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 43200

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      - name: Destroy leftovers
        env:
          PINECONE_API_KEY: ${{ inputs.tier == 'e2e' && secrets.PINECONE_API_KEY || 'unused-for-destroy' }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m destroy -s --destroy-stack "$PROJECT_STACK"

      - name: Destroy fixture VPC stack
        if: inputs.tier == 'e2e' && inputs.shape != 'vanilla'
        working-directory: ./tests/fixtures/byovpc
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          stack="${E2E_STACK_PREFIX}-${{ inputs.shape }}"
          pulumi cancel --yes --stack "$stack" 2>/dev/null || true
          pulumi install
          pulumi destroy --yes --stack "$stack"
          pulumi stack rm "$stack" --yes --force

      - name: Delete stand-in customer VPCs
        if: ${{ !cancelled() && inputs.tier == 'network' && inputs.shape != 'vanilla' }}
        run: |
          vpcs=$(aws ec2 describe-vpcs --region "$AWS_REGION" \
            --filters "Name=tag:pinecone-byoc-test,Values=${E2E_STACK_PREFIX}-*" \
            --query 'Vpcs[].VpcId' --output text)
          for vpc in $vpcs; do
            subnets=$(aws ec2 describe-subnets --region "$AWS_REGION" \
              --filters "Name=vpc-id,Values=$vpc" --query 'Subnets[].SubnetId' --output text)
            for subnet in $subnets; do
              aws ec2 delete-subnet --region "$AWS_REGION" --subnet-id "$subnet" || true
            done
            echo "deleting stand-in customer VPC $vpc"
            aws ec2 delete-vpc --region "$AWS_REGION" --vpc-id "$vpc"
          done

      - name: Upload teardown logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-aws-${{ inputs.shape }}-teardown-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
