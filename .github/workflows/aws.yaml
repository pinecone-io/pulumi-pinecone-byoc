name: E2E AWS

on:
  workflow_call:
    inputs:
      shape:
        description: >-
          Which network shape to deploy. Only vanilla (the module creates its own
          VPC) exists so far; the BYO-VPC shapes add themselves to the matrix.
        type: string
        default: vanilla
      tier:
        description: >-
          e2e installs this commit from scratch; upgrade installs the baseline
          release and upgrades it to this commit, which is two deploys.
        type: string
        default: upgrade
      baseline:
        description: git ref the upgrade tier installs before upgrading to this commit
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2

jobs:
  # the deploy the rest of the run works against: the baseline release for the
  # upgrade tier, this commit for e2e. It keeps its stacks, and `down` has them.
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/aws-e2e-runner
        with:
          tier: ${{ inputs.tier }}
          region: ${{ env.AWS_REGION }}
          role-arn: ${{ secrets.AWS_E2E_ROLE_ARN }}
          pulumi-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Deploy the network on its own
        if: inputs.tier == 'e2e'
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m network -s

      - name: Deploy (${{ inputs.tier }}, ${{ inputs.shape }})
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          UPGRADE_BASELINE_REF: ${{ inputs.baseline }}
          MARKER: ${{ inputs.tier == 'upgrade' && 'upgrade and baseline' || 'e2e' }}
        run: |
          uv run --extra aws pytest \
            -m "$MARKER" \
            -k "${{ contains(github.event.pull_request.labels.*.name, 'test:e2e:byovpc')
                && 'byovpc' || inputs.shape }}" -s --keep

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-aws-${{ inputs.shape }}-up-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          # both paths are dotted, and upload-artifact skips hidden files by default
          include-hidden-files: true
          if-no-files-found: warn
          # a public repository publishes its artifacts too; the harness redacts what
          # it writes, and these are kept only long enough to debug the run that made them
          retention-days: 3

  # the upgrade runs on its own runner against the deployment `up` left behind,
  # so a failure here re-runs from a live baseline instead of building one again
  upgrade:
    needs: up
    if: inputs.tier == 'upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/aws-e2e-runner
        with:
          tier: ${{ inputs.tier }}
          region: ${{ env.AWS_REGION }}
          role-arn: ${{ secrets.AWS_E2E_ROLE_ARN }}
          pulumi-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Upgrade (${{ inputs.shape }})
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          UPGRADE_BASELINE_REF: ${{ inputs.baseline }}
        run: |
          uv run --extra aws pytest \
            -m "upgrade and not baseline" \
            -k "${{ inputs.shape }}" -s --keep

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-aws-${{ inputs.shape }}-upgrade-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  down:
    needs: [up, upgrade]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/aws-e2e-runner
        with:
          tier: ${{ inputs.tier }}
          region: ${{ env.AWS_REGION }}
          role-arn: ${{ secrets.AWS_E2E_ROLE_ARN }}
          pulumi-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Destroy leftovers
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m destroy -s

      - name: Upload teardown logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-aws-teardown-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
