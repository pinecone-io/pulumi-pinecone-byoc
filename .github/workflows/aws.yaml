name: E2E AWS

on:
  workflow_call:
    inputs:
      shape:
        description: >-
          Which network shape to deploy: vanilla (module creates the VPC),
          public/private (adopt existing subnets) or carve (module carves subnets
          inside an adopted VPC).
        type: string
        default: vanilla

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  PINECONE_REGION: us-east-1
  PINECONE_AZS: us-east-1a,us-east-1b
  PINECONE_VPC_CIDR: 10.0.0.0/16
  PINECONE_DELETION_PROTECTION: "false"
  PINECONE_PUBLIC_ACCESS: "false"
  PINECONE_PROJECT_NAME: pinecone-byoc
  # non-prod control plane; the module defaults to production
  PINECONE_GLOBAL_ENV: ci
  PINECONE_API_URL: https://api-staging.pinecone.io
  PINECONE_AUTH0_DOMAIN: https://internal-beta-pinecone-io.us.auth0.com
  PINECONE_GCP_PROJECT: development-pinecone

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack prefix
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "BYOVPC_STACK_PREFIX=ci-aws-pr${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "BYOVPC_STACK_PREFIX=ci-aws-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 43200

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # generates the project with the headless wizard, deploys it, streams the
      # installer pod logs, then destroys everything in teardown
      - name: Deploy and tear down (${{ inputs.shape }})
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m e2e -k "e2e_${{ inputs.shape }}" -s

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-aws-${{ inputs.shape }}-logs
          path: |
            .byovpc-logs/
            .e2e/**/*.log
          if-no-files-found: warn
          retention-days: 14

  # safety net: the deploy job destroys its own stacks, but a cancelled job or a
  # timeout kills that teardown mid-flight and would leak a cluster.
  down:
    needs: up
    if: always() && needs.up.result != 'skipped' && needs.up.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack prefix
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "BYOVPC_STACK_PREFIX=ci-aws-pr${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "BYOVPC_STACK_PREFIX=ci-aws-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 43200

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      # the killed job left no project directory behind, so regenerate the same
      # program (--dev points it at this checkout) and destroy from there
      - name: Regenerate project
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          uv run --with rich --with pyyaml python setup/wizard.py \
            --cloud aws \
            --headless \
            --stack-name "${BYOVPC_STACK_PREFIX}-${{ inputs.shape }}-byoc" \
            --skip-install \
            --output-dir ./e2e-project \
            --dev

      - name: Install dependencies
        working-directory: ./e2e-project
        run: uv sync

      - name: Destroy leftovers
        working-directory: ./e2e-project
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          stack="${BYOVPC_STACK_PREFIX}-${{ inputs.shape }}-byoc"
          pulumi cancel --yes --stack "$stack" 2>/dev/null || true
          pulumi destroy --yes --stack "$stack"
          pulumi stack rm "$stack" --yes --force

      - name: Destroy fixture VPC
        if: inputs.shape != 'vanilla'
        working-directory: ./tests/fixtures/byovpc
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          stack="${BYOVPC_STACK_PREFIX}-${{ inputs.shape }}"
          pulumi cancel --yes --stack "$stack" 2>/dev/null || true
          pulumi install
          pulumi destroy --yes --stack "$stack"
          pulumi stack rm "$stack" --yes --force
