name: E2E AWS

on:
  workflow_call:
    inputs:
      shape:
        description: which e2e shape to deploy; the caller reads the PR's labels
        type: string
        default: vanilla
      client:
        description: >-
          the machine the operator drives the deploy from. Not a shape: the cluster
          is the same either way, and what is under test is the wizard and the
          harness on a customer's own workstation.
        type: string
        default: linux

permissions:
  contents: read
  id-token: write

# every run: step here is written for sh, and a windows runner would otherwise
# hand them to pwsh
defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-2

jobs:
  up:
    runs-on: ${{ inputs.client == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 150
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack prefix
        run: |
          # teardown destroys by prefix, so a leg sharing one with another leg in
          # the same run would take that leg's stacks down mid-deploy
          if [ "$CLIENT" = windows ]; then tag=-win; else tag=; fi
          if [ -n "$PR_NUMBER" ]; then
            echo "E2E_STACK_PREFIX=ci-aws${tag}-pr${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "E2E_STACK_PREFIX=ci-aws${tag}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLIENT: ${{ inputs.client }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 43200

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy the network on its own
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m network -s

      - name: Deploy
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          SHAPE: ${{ inputs.shape || 'vanilla' }}
        # private is a substring of byovpc-private, and would take its cluster too
        run: |
          case "$SHAPE" in
            private) select="private and not byovpc and not byodns" ;;
            *)       select="$SHAPE" ;;
          esac
          uv run --extra aws pytest -m e2e -s --keep -k "$select"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-aws-logs${{ inputs.client == 'windows' && '-win' || '' }}${{ inputs.shape && format('-{0}', inputs.shape) || '' }}
          path: |
            .e2e-logs/
            .e2e/**/*.log
          # both paths are dotted, and upload-artifact skips hidden files by default
          include-hidden-files: true
          if-no-files-found: warn
          # a public repository publishes its artifacts too; the harness redacts what
          # it writes, and these are kept only long enough to debug the run that made them
          retention-days: 3

  down:
    needs: up
    if: always()
    runs-on: ${{ inputs.client == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack prefix
        run: |
          # teardown destroys by prefix, so a leg sharing one with another leg in
          # the same run would take that leg's stacks down mid-deploy
          if [ "$CLIENT" = windows ]; then tag=-win; else tag=; fi
          if [ -n "$PR_NUMBER" ]; then
            echo "E2E_STACK_PREFIX=ci-aws${tag}-pr${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "E2E_STACK_PREFIX=ci-aws${tag}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLIENT: ${{ inputs.client }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 43200

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      - name: Destroy leftovers
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m destroy -s

      - name: Upload teardown logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-aws-teardown-logs${{ inputs.client == 'windows' && '-win' || '' }}${{ inputs.shape && format('-{0}', inputs.shape) || '' }}
          path: |
            .e2e-logs/
            .e2e/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
