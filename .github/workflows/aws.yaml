name: E2E AWS

on:
  workflow_call:
    inputs:
      shape:
        description: which e2e shape to deploy; the caller reads the PR's labels
        type: string
        default: vanilla
      client:
        description: >-
          the machine the operator drives the deploy from. Not a shape: the cluster
          is the same either way, and what is under test is the wizard and the
          harness on a customer's own workstation.
        type: string
        default: linux
      tier:
        description: >-
          e2e installs this commit from scratch; upgrade installs the baseline
          release and upgrades it to this commit, which is two deploys and is
          asked for by the test:e2e:upgrade label.
        type: string
        default: e2e
      baseline:
        description: git ref the upgrade tier installs before upgrading to this commit
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

# every run: step here is written for sh, and a windows runner would otherwise
# hand them to pwsh
defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-2

jobs:
  # the deploy the rest of the run works against: the baseline release for the
  # upgrade tier, this commit for e2e. It keeps its stacks, and `down` has them.
  #
  # The upgrade tier plans before it deploys - the wizard test is first in the file,
  # so a preflight refusal or a program that does not resolve fails this job in two
  # minutes rather than forty. Run 31888171734 found out that the account had one
  # Elastic IP and needed two.
  up:
    runs-on: ${{ inputs.client == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 150
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/aws-e2e-runner
        with:
          tier: ${{ inputs.tier }}
          client: ${{ inputs.client }}
          region: ${{ env.AWS_REGION }}
          role-arn: ${{ secrets.AWS_E2E_ROLE_ARN }}
          pulumi-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Deploy the network on its own
        if: inputs.tier == 'e2e'
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m network -s

      - name: Deploy (${{ inputs.tier }}, ${{ inputs.shape }})
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          SHAPE: ${{ inputs.shape || 'vanilla' }}
          TIER: ${{ inputs.tier }}
          UPGRADE_BASELINE_REF: ${{ inputs.baseline }}
          MARKER: ${{ inputs.tier == 'upgrade' && 'wizard or baseline' || 'e2e' }}
        # private is a substring of byovpc-private, and would take its cluster too
        run: |
          case "$SHAPE" in
            private) select="private and not byovpc and not byosubnet and not byodns" ;;
            *)       select="$SHAPE" ;;
          esac
          uv run --extra aws pytest -m "$MARKER" -s --keep -k "$select"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-aws${{ inputs.client == 'windows' && '-win' || '' }}-${{ inputs.shape }}-up-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          # both paths are dotted, and upload-artifact skips hidden files by default
          include-hidden-files: true
          if-no-files-found: warn
          # a public repository publishes its artifacts too; the harness redacts what
          # it writes, and these are kept only long enough to debug the run that made them
          retention-days: 3

  # the upgrade runs on its own runner against the deployment `up` left behind,
  # so a failure here re-runs from a live baseline instead of building one again
  upgrade:
    needs: up
    if: inputs.tier == 'upgrade'
    runs-on: ${{ inputs.client == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 150
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/aws-e2e-runner
        with:
          tier: ${{ inputs.tier }}
          client: ${{ inputs.client }}
          region: ${{ env.AWS_REGION }}
          role-arn: ${{ secrets.AWS_E2E_ROLE_ARN }}
          pulumi-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Upgrade (${{ inputs.shape }})
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          SHAPE: ${{ inputs.shape || 'vanilla' }}
          UPGRADE_BASELINE_REF: ${{ inputs.baseline }}
        # private is a substring of byovpc-private, and would take its cluster too
        run: |
          case "$SHAPE" in
            private) select="private and not byovpc and not byosubnet and not byodns" ;;
            *)       select="$SHAPE" ;;
          esac
          uv run --extra aws pytest -m upgrade -s --keep -k "$select"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-aws${{ inputs.client == 'windows' && '-win' || '' }}-${{ inputs.shape }}-upgrade-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  down:
    needs: [up, upgrade]
    if: always()
    runs-on: ${{ inputs.client == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: aws-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/aws-e2e-runner
        with:
          tier: ${{ inputs.tier }}
          client: ${{ inputs.client }}
          region: ${{ env.AWS_REGION }}
          role-arn: ${{ secrets.AWS_E2E_ROLE_ARN }}
          pulumi-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Destroy leftovers
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: uv run --extra aws pytest -m destroy -s

      - name: Upload teardown logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-aws${{ inputs.client == 'windows' && '-win' || '' }}-${{ inputs.shape }}-teardown-logs
          path: |
            .e2e-logs/
            .e2e/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
