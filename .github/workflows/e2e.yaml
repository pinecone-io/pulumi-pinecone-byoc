# A pull request that touches AWS runs, cheapest first: a targeted apply of the
# carved network, a targeted apply of the vanilla network - a separate copy of the
# subnet code, so it needs exercising of its own - and then the one full deploy,
# into a stand-in customer VPC, which is the only thing that proves egress,
# install and ingress work in an adopted network.
name: E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: network applies only the VPC component; e2e deploys a cluster
        type: choice
        options: [e2e, network]
        default: e2e
      shapes:
        description: 'JSON list of AWS shapes to run, e.g. ["carve","vanilla"]'
        type: string
        default: '["carve"]'

concurrency:
  group: byoc-e2e
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      gcp: ${{ steps.filter.outputs.gcp }}
      azure: ${{ steps.filter.outputs.azure }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Pick the AWS runs
        id: matrix
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            matrix=$(jq -cn --argjson shapes "$SHAPES" --arg tier "$TIER" \
              '{include: [$shapes[] | {shape: ., tier: $tier}]}')
          else
            matrix='{"include":[
              {"shape":"carve","tier":"network"},
              {"shape":"vanilla","tier":"network"},
              {"shape":"carve","tier":"e2e"}
            ]}'
          fi
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .
        env:
          SHAPES: ${{ inputs.shapes }}
          TIER: ${{ inputs.tier }}

      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aws:
              - 'pulumi_pinecone_byoc/aws/**'
              - 'pulumi_pinecone_byoc/common/**'
              - 'config/aws.py'
              - 'config/base.py'
              - 'config/__init__.py'
              - 'setup/wizard.py'
              - 'tests/**'
              - 'pytest.ini'
              - '.github/workflows/aws.yaml'
            gcp:
              - 'pulumi_pinecone_byoc/gcp/**'
              - 'pulumi_pinecone_byoc/common/**'
              - 'config/gcp.py'
              - 'config/base.py'
              - 'config/__init__.py'
            azure:
              - 'pulumi_pinecone_byoc/azure/**'
              - 'pulumi_pinecone_byoc/common/**'
              - 'config/azure.py'
              - 'config/base.py'
              - 'config/__init__.py'

  aws:
    needs: changes
    if: needs.changes.outputs.aws == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      # one at a time, cheapest first, and the full deploy does not start if a
      # targeted apply already failed
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/aws.yaml
    with:
      shape: ${{ matrix.shape }}
      tier: ${{ matrix.tier }}
    secrets: inherit

  gcp:
    needs: [changes, aws]
    if: ${{ !cancelled() && (needs.changes.outputs.gcp == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/gcp.yaml
    secrets: inherit

  azure:
    needs: [changes, gcp]
    if: ${{ !cancelled() && (needs.changes.outputs.azure == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/azure.yaml
    secrets: inherit

  result:
    if: always()
    needs: [changes, aws, gcp, azure]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "AWS: ${{ needs.aws.result }}"
          echo "GCP: ${{ needs.gcp.result }}"
          echo "Azure: ${{ needs.azure.result }}"
          if [ "${{ needs.aws.result }}" = "failure" ] || [ "${{ needs.gcp.result }}" = "failure" ] || [ "${{ needs.azure.result }}" = "failure" ]; then
            echo "E2E failed"
            exit 1
          fi
          if [ "${{ needs.aws.result }}" = "cancelled" ] || [ "${{ needs.gcp.result }}" = "cancelled" ] || [ "${{ needs.azure.result }}" = "cancelled" ]; then
            echo "E2E cancelled"
            exit 1
          fi
          echo "OK"
