name: E2E

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: byoc-e2e
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      gcp: ${{ steps.filter.outputs.gcp }}
      azure: ${{ steps.filter.outputs.azure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aws:
              - 'pulumi_pinecone_byoc/aws/**'
              - 'pulumi_pinecone_byoc/common/**'
              - 'config/aws.py'
              - 'config/base.py'
              - 'config/__init__.py'
              - 'setup/wizard.py'
              - 'tests/**'
              - 'pytest.ini'
              - '.github/workflows/aws.yaml'
            gcp:
              - 'pulumi_pinecone_byoc/gcp/**'
              - 'pulumi_pinecone_byoc/common/**'
              - 'config/gcp.py'
              - 'config/base.py'
              - 'config/__init__.py'
              - '.github/workflows/gcp.yaml'
            azure:
              - 'pulumi_pinecone_byoc/azure/**'
              - 'pulumi_pinecone_byoc/common/**'
              - 'config/azure.py'
              - 'config/base.py'
              - 'config/__init__.py'
              - '.github/workflows/azure.yaml'

  # a test:e2e: label names a shape, and a PR may ask for more than one. They deploy
  # into the same account and fight over quota, so they take their turn rather than
  # racing - and a shape nobody asked for is still the vanilla one.
  shapes:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.pick.outputs.shapes }}
    steps:
      - id: pick
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # the label a shape is asked for by, and the shape it selects: byovpc has
          # meant the public one since before there was a private one to tell it from
          known='{"vanilla":"vanilla","private":"private","byovpc":"byovpc-public","byovpc-private":"byovpc-private"}'
          picked=$(jq -c --argjson labels "$LABELS" \
            '[to_entries[] | .key as $k | select($labels | index("test:e2e:" + $k)) | .value]' \
            <<<"$known")
          if [ "$picked" = "[]" ]; then picked='["vanilla"]'; fi
          echo "shapes=$picked" >> "$GITHUB_OUTPUT"
          echo "running: $picked"

  aws:
    needs: [changes, shapes]
    if: needs.changes.outputs.aws == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      # one at a time: the account has quota for one cluster, not two. And the
      # shapes on one PR fail together far more often than not, so the first
      # failure stops the rest rather than spending an hour re-learning it - a
      # leg's teardown still runs, because a leg is the whole called workflow and
      # it is only done once that has
      max-parallel: 1
      fail-fast: true
      matrix:
        shape: ${{ fromJSON(needs.shapes.outputs.aws) }}
    uses: ./.github/workflows/aws.yaml
    with:
      shape: ${{ matrix.shape }}
    secrets: inherit

  gcp:
    needs: [changes, aws]
    if: ${{ !cancelled() && (needs.changes.outputs.gcp == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/gcp.yaml
    secrets: inherit

  azure:
    needs: [changes, gcp]
    if: ${{ !cancelled() && (needs.changes.outputs.azure == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/azure.yaml
    secrets: inherit

  result:
    if: always()
    needs: [changes, aws, gcp, azure]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "AWS: ${{ needs.aws.result }}"
          echo "GCP: ${{ needs.gcp.result }}"
          echo "Azure: ${{ needs.azure.result }}"
          if [ "${{ needs.aws.result }}" = "failure" ] || [ "${{ needs.gcp.result }}" = "failure" ] || [ "${{ needs.azure.result }}" = "failure" ]; then
            echo "E2E failed"
            exit 1
          fi
          if [ "${{ needs.aws.result }}" = "cancelled" ] || [ "${{ needs.gcp.result }}" = "cancelled" ] || [ "${{ needs.azure.result }}" = "cancelled" ]; then
            echo "E2E cancelled"
            exit 1
          fi
          echo "OK"
