name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}

# a group per leg, not per run: a fix for a failed aws leg would otherwise queue
# behind the previous run's gcp and azure - and a group queues one job, so a run
# reaching the same group twice would evict what the newer run has waiting.
# Cancelling an up would leave a cluster, so nothing here cancels in progress.

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    if: ${{ github.event.action != 'labeled' || startsWith(github.event.label.name, 'test:e2e:') }}
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      gcp: ${{ steps.filter.outputs.gcp }}
      azure: ${{ steps.filter.outputs.azure }}
    steps:
      - id: filter
        run: |
          for cloud in aws gcp azure; do echo "$cloud=true" >> "$GITHUB_OUTPUT"; done

  # a PR may ask for more than one shape; unasked, it gets vanilla
  shapes:
    if: ${{ github.event.action != 'labeled' || startsWith(github.event.label.name, 'test:e2e:') }}
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.pick.outputs.shapes }}
    steps:
      - id: pick
        run: |
          echo 'shapes=["vanilla","private","byovpc-public"]' >> "$GITHUB_OUTPUT"

  # where the deploy is driven from, not which cluster to build - so it is its own
  # job rather than a member of the shape matrix. The aws leg waits on it because
  # the two share one cluster's worth of quota
  windows-client:
    needs: changes
    if: true
    concurrency:
      group: byoc-e2e-aws-windows-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/noop-cloud.yaml
    with:
      shape: vanilla
      client: windows
    secrets: inherit

  aws:
    needs: [changes, shapes, windows-client]
    if: ${{ !cancelled() && (needs.changes.outputs.aws == 'true' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: byoc-e2e-aws-${{ matrix.shape }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    strategy:
      # one cluster's worth of quota, and shapes on a PR fail together - so stop at
      # the first. A leg is the whole called workflow, so its teardown still runs.
      max-parallel: 1
      fail-fast: true
      matrix:
        shape: ${{ fromJSON(needs.shapes.outputs.aws) }}
    uses: ./.github/workflows/noop-cloud.yaml
    with:
      shape: ${{ matrix.shape }}
    secrets: inherit

  gcp:
    needs: [changes, aws]
    # a cancelled aws leg means a newer push took the slot; nothing behind it matters
    if: ${{ !cancelled() && needs.aws.result != 'cancelled' && (needs.changes.outputs.gcp == 'true' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: byoc-e2e-gcp-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/noop-cloud.yaml
    secrets: inherit

  azure:
    needs: [changes, aws, gcp]
    if: ${{ !cancelled() && needs.aws.result != 'cancelled' && needs.gcp.result != 'cancelled' && (needs.changes.outputs.azure == 'true' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: byoc-e2e-azure-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/noop-cloud.yaml
    secrets: inherit

  result:
    if: always()
    needs: [changes, aws, gcp, azure, windows-client]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "AWS: ${{ needs.aws.result }}"
          echo "GCP: ${{ needs.gcp.result }}"
          echo "Azure: ${{ needs.azure.result }}"
          echo "Windows client: ${{ needs['windows-client'].result }}"
          if [ "${{ needs.aws.result }}" = "failure" ] || [ "${{ needs.gcp.result }}" = "failure" ] || [ "${{ needs.azure.result }}" = "failure" ] || [ "${{ needs['windows-client'].result }}" = "failure" ]; then
            echo "E2E failed"
            exit 1
          fi
          if [ "${{ needs.aws.result }}" = "cancelled" ] || [ "${{ needs.gcp.result }}" = "cancelled" ] || [ "${{ needs.azure.result }}" = "cancelled" ]; then
            echo "E2E cancelled"
            exit 1
          fi
          echo "OK"
