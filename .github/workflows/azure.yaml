name: E2E Azure

on:
  workflow_call: {}

permissions:
  contents: read
  id-token: write

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-e2e
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack name
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "STACK_NAME=ci-azure-pr${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "STACK_NAME=ci-azure-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy a cell and snapshot it if it fails
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E2E_STACK_PREFIX: ${{ env.STACK_NAME }}
        run: uv run --extra azure pytest -m "e2e and azure" -s

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-azure-logs
          path: .e2e-logs/
          if-no-files-found: ignore

  down:
    needs: up
    if: always() && needs.up.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-e2e
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set stack name
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "STACK_NAME=ci-azure-pr${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "STACK_NAME=ci-azure-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Set default Pulumi org
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi org set-default pinecone

      - name: Destroy leftovers
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          E2E_STACK_PREFIX: ${{ env.STACK_NAME }}
        run: uv run --extra azure pytest -m destroy -s
