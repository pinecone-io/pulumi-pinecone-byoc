name: Weekly E2E

# A PR pays for one shape on one cloud. Nothing on main covers the rest, so every
# shape that CI can skip is a shape that only breaks in a customer's account.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

concurrency:
  # the same group the PR run uses: these deploy into the same accounts, and two
  # runs at once fight over quota rather than finishing sooner
  group: byoc-e2e
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  aws-vanilla:
    uses: ./.github/workflows/aws.yaml
    with:
      shape: vanilla
    secrets: inherit

  aws-private:
    needs: aws-vanilla
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/aws.yaml
    with:
      shape: private
    secrets: inherit

  gcp:
    needs: aws-private
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gcp.yaml
    secrets: inherit

  azure:
    needs: gcp
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/azure.yaml
    secrets: inherit

  result:
    if: always()
    needs: [aws-vanilla, aws-private, gcp, azure]
    runs-on: ubuntu-latest
    steps:
      - name: Report what ran
        run: |
          echo "AWS vanilla: ${{ needs.aws-vanilla.result }}"
          echo "AWS private: ${{ needs.aws-private.result }}"
          echo "GCP:         ${{ needs.gcp.result }}"
          echo "Azure:       ${{ needs.azure.result }}"
          for result in "${{ needs.aws-vanilla.result }}" "${{ needs.aws-private.result }}" \
                        "${{ needs.gcp.result }}" "${{ needs.azure.result }}"; do
            case "$result" in
              failure|cancelled) echo "weekly e2e $result"; exit 1 ;;
            esac
          done
          echo "OK"
