[pytest]
testpaths = tests
addopts = -m 'not integration and not e2e'
markers =
    integration: provisions a stand-in customer VPC via the byovpc fixture
    e2e: provisions a VPC and deploys a full BYOC cluster into it
aws_profile = byoc-dev
aws_region = us-east-2
byovpc_azs = us-east-2a,us-east-2b
