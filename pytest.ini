[pytest]
testpaths = tests
addopts = -m 'not integration and not e2e and not network and not destroy'
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(message)s
log_cli_date_format = %H:%M:%S
markers =
    integration: provisions real cloud infrastructure and asserts against it
    network: deploys only the VPC, with network-only, and destroys it
    e2e: provisions a VPC and deploys a full BYOC cluster into it
    destroy: tears down a stack an e2e run left behind
aws_profile = byoc-dev
aws_region = us-east-2
e2e_azs = us-east-2a,us-east-2b

pinecone_global_env = ci
pinecone_api_url = https://api-staging.pinecone.io
pinecone_auth0_domain = https://internal-beta-pinecone-io.us.auth0.com
pinecone_gcp_project = development-pinecone
