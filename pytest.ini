[pytest]
testpaths = tests
addopts = -m 'not integration and not e2e and not network and not destroy'
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(message)s
log_cli_date_format = %H:%M:%S
markers =
    integration: provisions real cloud infrastructure and asserts against it
    network: deploys only the VPC, with network-only, and destroys it
    e2e: provisions a VPC and deploys a full BYOC cluster into it
    destroy: tears down a stack an e2e run left behind
aws_profile = byoc-dev
aws_region = us-east-2
e2e_azs = us-east-2a,us-east-2b

# the domain the byodns shapes hang their cell off: the zone tests/dns/parent makes
# in byoc-ci, delegated from byoc.pinecone.io by hand, once. That stack is run by
# hand and never by CI, and nothing destroys the zone - the record pointing at it
# lives in a zone we do not own.
#
# It sits under byoc.pinecone.io because that is the zone this team already holds,
# so the delegation is one ask of people who have answered it before rather than a
# search for whoever owns pinecone.io. That only stands in for a customer while the
# control plane decides what is its own by comparing the whole domain to
# pinecone.io: the day that becomes a suffix check, this name is inside a zone the
# control plane hosts, the shapes quietly take the default path, and this has to move.
#
# Keep it short. ACM caps a certificate's first domain name at 64 characters, and
# the module's private cert spends 41 of them before this name starts.
e2e_parent_domain = dns.byoc.pinecone.io

pinecone_global_env = ci
pinecone_api_url = https://api-staging.pinecone.io
pinecone_auth0_domain = https://internal-beta-pinecone-io.us.auth0.com
pinecone_gcp_project = development-pinecone
